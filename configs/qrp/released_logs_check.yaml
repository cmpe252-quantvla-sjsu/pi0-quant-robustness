# Sanity check of the QRP script on VLAQuantBench's released pi0 logs (clean LIBERO-Spatial).
# "fake_shift" reuses the clean files, so its QRP point estimate must be exactly 0. Its interval
# is exactly [0, 0] only with bootstrap_within: fixed (the default); with resample it has width.
# Paths are relative to the VLAQuantBench clone, so pass it with --base-dir:
#   python scripts/qrp_bootstrap.py configs/qrp/released_logs_check.yaml --base-dir ../VLAQuantBench
baseline: BF16
primary: VE-W4
conditions:
  clean: {kind: clean}
  fake_shift: {kind: visual}
cells:
  clean:
    BF16:  results/libero/libero_spatial/pi0/rtn-BASELINE-e2e.jsonl
    VE-W4: results/libero/libero_spatial/pi0/rtn-W4-ve.jsonl
    W4:    results/libero/libero_spatial/pi0/rtn-W4-e2e.jsonl
    W8:    results/libero/libero_spatial/pi0/rtn-W8-e2e.jsonl
  fake_shift:
    BF16:  results/libero/libero_spatial/pi0/rtn-BASELINE-e2e.jsonl
    VE-W4: results/libero/libero_spatial/pi0/rtn-W4-ve.jsonl
